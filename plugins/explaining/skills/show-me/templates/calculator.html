<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Calculator title]</title>
<!--
  Calculator shell: a business rule with numbers. Move the inputs, the result and a one-sentence
  explanation of the rule update live. Edit only the CALC object below. Real client rules and
  numbers only; start the sliders at a real case.
-->
<style id="tokens">
/* explorable: A warm paper desk where the numbers are toys: serif headline, huge rolling figures, color that names a variable.
 * Source: https://brilliant.org
 */
@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap");

:root{
  color-scheme:light dark;
  --bg:#f3f2ef;
  --surface:#ffffff;
  --ink:#141413;
  --muted:#66655f;
  --line:#e4e2dc;
  --accent:#2f5bea; --accent-text:var(--accent);
  --accent-ink:#ffffff;
  --ok:#17784c;
  --warn:#8a5200;
  --bad:#b42318;
  --shadow:0 1px 0 var(--line),0 12px 32px rgba(20,20,19,.06);
  --sheet-2:#faf9f6;
  --var-1:#2f5bea;
  --var-1-soft:#e7edfd;
  --var-2:#7a4cf0;
  --var-2-soft:#efe9fd;
  --var-3:#e0662d;
  --var-3-soft:#fcece3;
  --press:0 3px 0 var(--line);
  --font-display:"Instrument Serif",Georgia,serif;
  --font-body:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --h1:clamp(44px,7vw,96px);
  --h1-weight:400;
  --h1-track:-.02em;
  --h1-lead:1;
  --body:17px;
  --lead:1.6;
  --measure:62ch;
  --space:8px;
  --radius:16px;
  --border:1px solid var(--line);
  --ease:cubic-bezier(.22,1,.36,1);
  --t-fast:160ms;
  --t-med:450ms;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --big-number:clamp(48px,7vw,104px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121211;
    --surface:#1b1b1a;
    --ink:#f2f1ec;
    --muted:#a3a19a;
    --line:#2e2d2a;
    --accent:#7c9bff; --accent-text:var(--accent);
    --accent-ink:#121211;
    --ok:#4cc38a;
    --warn:#f2b544;
    --bad:#f26b57;
    --shadow:0 1px 0 var(--line),0 12px 32px rgba(0,0,0,.35);
    --sheet-2:#20201e;
    --var-1:#7c9bff;
    --var-1-soft:#1b2340;
    --var-2:#b195ff;
    --var-2-soft:#271e3f;
    --var-3:#ff9a66;
    --var-3-soft:#3a2216;
  }
}
:root[data-theme="dark"]{
  --bg:#121211;
  --surface:#1b1b1a;
  --ink:#f2f1ec;
  --muted:#a3a19a;
  --line:#2e2d2a;
  --accent:#7c9bff; --accent-text:var(--accent);
  --accent-ink:#121211;
  --ok:#4cc38a;
  --warn:#f2b544;
  --bad:#f26b57;
  --shadow:0 1px 0 var(--line),0 12px 32px rgba(0,0,0,.35);
  --sheet-2:#20201e;
  --var-1:#7c9bff;
  --var-1-soft:#1b2340;
  --var-2:#b195ff;
  --var-2-soft:#271e3f;
  --var-3:#ff9a66;
  --var-3-soft:#3a2216;
}
@media (prefers-reduced-motion:reduce){:root{--t-fast:0ms;--t-med:0ms}}
</style>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--body)/var(--lead) var(--font-body);display:flex;justify-content:center;padding:calc(var(--space)*3) calc(var(--space)*2)}
.app{width:100%;max-width:640px;display:flex;flex-direction:column;gap:calc(var(--space)*2)}
h1{font:var(--h1-weight) clamp(32px,6vw,48px)/var(--h1-lead) var(--font-display);letter-spacing:var(--h1-track);margin:0}
.sub{color:var(--muted);margin:calc(var(--space)/2) 0 0}
.card{background:var(--surface);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:calc(var(--space)*2.5)}
.field{display:grid;grid-template-columns:1fr auto;gap:2px calc(var(--space)*1.5);align-items:center;margin-bottom:calc(var(--space)*2)}
.field:last-child{margin-bottom:0}
.field label{font-weight:600}
.field .val{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent-text)}
.field input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.field input[type=number]{width:130px;font:inherit;font-family:var(--font-mono);padding:var(--space);border-radius:calc(var(--radius)/2);border:var(--border);background:var(--bg);color:var(--ink)}
.field .hint{grid-column:1/-1;font-size:13px;color:var(--muted)}
.result{text-align:center}
.result .label{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.result .num{font-family:var(--font-display);font-size:var(--big-number,clamp(48px,8vw,72px));font-weight:var(--h1-weight);font-variant-numeric:tabular-nums;line-height:1.05;margin:var(--space) 0}
.result .tag{display:inline-block;font-size:12px;font-weight:700;padding:2px calc(var(--space)*1.5);border-radius:999px;border:1.5px solid currentColor}
.rule{font-size:var(--body);border-left:4px solid var(--accent);padding:calc(var(--space)/2) 0 calc(var(--space)/2) calc(var(--space)*1.5);max-width:var(--measure)}
</style>
</head>
<body>
<div class="app">
  <div><h1 id="title"></h1><p class="sub" id="sub"></p></div>
  <div class="card" id="inputs"></div>
  <div class="card result">
    <div class="label" id="resLabel"></div>
    <div class="num" id="resNum"></div>
    <span class="tag" id="resTag"></span>
  </div>
  <div class="rule" id="rule"></div>
</div>

<script>
// ===== Edit this. Placeholders are in [brackets]. =====
const CALC = {
  title: "[What this works out, in the client's words]",
  sub: "[Map box: the box name on map.html]",
  inputs: [
    // type "range" for a slider, "number" for a typed value. Start at a real case.
    { id: "a", label: "[First input]", type: "range", min: 0, max: 100, step: 1, value: 80, unit: "%", hint: "[What it is, one clause]" },
    { id: "b", label: "[Second input]", type: "number", min: 0, max: 1000000, step: 100, value: 10000, unit: "$", hint: "[What it is, one clause]" }
  ],
  resultLabel: "[What the result is]",
  // The rule. Gets the input values by id, returns { value, text, tag, tone }.
  // text is ONE plain sentence that explains why the result is what it is, with the numbers.
  compute: v => {
    const value = v.b * v.a / 100;  // [replace with the real rule]
    return {
      value: "$" + value.toLocaleString(),
      text: `[Plain sentence: with ${v.a}% and $${v.b.toLocaleString()}, the rule gives $${value.toLocaleString()}, because ...]`,
      tag: v.a >= 50 ? "[above the line]" : "[below the line]",
      tone: v.a >= 50 ? "ok" : "warn"
    };
  }
};
// ===== End of edits. =====

const $ = id => document.getElementById(id);
$("title").textContent = CALC.title; $("sub").textContent = CALC.sub; $("resLabel").textContent = CALC.resultLabel;
const fmt = (inp, x) => inp.unit === "$" ? "$" + Number(x).toLocaleString() : Number(x).toLocaleString() + (inp.unit || "");
for (const inp of CALC.inputs){
  const f = document.createElement("div"); f.className = "field";
  f.innerHTML = `<label for="${inp.id}"></label><span class="val" id="${inp.id}-val"></span>
    <input id="${inp.id}" type="${inp.type}" min="${inp.min}" max="${inp.max}" step="${inp.step}" value="${inp.value}">
    <span class="hint"></span>`;
  f.querySelector("label").textContent = inp.label;
  f.querySelector(".hint").textContent = inp.hint || "";
  if (inp.type === "number") f.querySelector("input").style.gridColumn = "1/-1";
  $("inputs").appendChild(f);
  f.querySelector("input").addEventListener("input", update);
}
function update(){
  const v = {};
  for (const inp of CALC.inputs){
    v[inp.id] = Number($(inp.id).value);
    $(inp.id + "-val").textContent = fmt(inp, v[inp.id]);
  }
  const r = CALC.compute(v);
  $("resNum").textContent = r.value;
  $("rule").textContent = r.text;
  const tag = $("resTag"); tag.textContent = r.tag || ""; tag.style.display = r.tag ? "" : "none";
  tag.style.color = r.tone === "warn" ? "var(--warn)" : "var(--ok)";
}
update();
</script>
</body>
</html>
