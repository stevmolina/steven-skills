<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Scene title]</title>
<!--
  3D scene shell: how the parts of the client's business fit. Labelled nodes, edges between
  them, and particles flowing along each edge in the direction things move (goods, money,
  files). Drag to orbit, scroll to zoom, click a node to read what it is.
  Colors are design tokens: node and edge colors name a token (--flow-a .. --flow-d). To restyle,
  replace the contents of the tokens style slot (id tokens) with another design system's tokens.css.
  Edit only the SCENE object below. 8 nodes or fewer, real names, one plain clause per node.
  Three.js loads from a CDN, so it needs a network connection; no build step.
-->
<style id="tokens">
/* control-room: Near-black control room: hairlines made of light, one glowing accent, flow shown by motion.
 * Source: https://linear.app
 */
@import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap");

:root{
  color-scheme:dark light;
  --bg:#08090a;
  --surface:#0f1012;
  --ink:#f7f8f8;
  --muted:#8a8f98;
  --line:rgba(255,255,255,.08);
  --accent:#8b9cff; --accent-text:var(--accent);
  --accent-ink:#08090a;
  --ok:#4cc38a;
  --warn:#f2b544;
  --bad:#f26b57;
  --shadow:0 0 0 1px var(--line),0 8px 30px rgba(0,0,0,.45);
  --line-strong:rgba(255,255,255,.16);
  --faint:#5c6068;
  --sheet-2:#16171a;
  --accent-soft:rgba(139,156,255,.12);
  --flow-a:#8b9cff;
  --flow-b:#4cc38a;
  --flow-c:#a1a1a8;
  --flow-d:#c39bff;
  --bg-glow:radial-gradient(60% 50% at 50% 0%,rgba(140,160,255,.10),transparent 70%);
  --headline:linear-gradient(180deg,#fff 30%,rgba(255,255,255,.55));
  --font-display:"Geist",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Geist",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --h1:clamp(40px,6vw,84px);
  --h1-weight:600;
  --h1-track:-.045em;
  --h1-lead:1.02;
  --body:16px;
  --lead:1.55;
  --measure:64ch;
  --space:8px;
  --radius:12px;
  --border:1px solid var(--line);
  --ease:cubic-bezier(.16,1,.3,1);
  --t-fast:140ms;
  --t-med:320ms;
  --flow-speed:1.6s;
  --ease-in-out:cubic-bezier(.65,0,.35,1);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#fafafa;
    --surface:#ffffff;
    --ink:#0b0b0c;
    --muted:#62666d;
    --line:rgba(0,0,0,.08);
    --accent:#4353ff; --accent-text:var(--accent);
    --accent-ink:#ffffff;
    --ok:#17784c;
    --warn:#8a5200;
    --bad:#b42318;
    --shadow:0 0 0 1px var(--line),0 6px 24px rgba(0,0,0,.06);
    --line-strong:rgba(0,0,0,.16);
    --faint:#9a9ea6;
    --sheet-2:#f4f4f5;
    --accent-soft:rgba(67,83,255,.08);
    --flow-a:#4353ff;
    --flow-b:#17784c;
    --flow-c:#8a8f98;
    --flow-d:#7c4dff;
    --bg-glow:radial-gradient(60% 50% at 50% 0%,rgba(80,100,240,.07),transparent 70%);
    --headline:linear-gradient(180deg,#0b0b0c 40%,rgba(11,11,12,.6));
  }
}
:root[data-theme="light"]{
  --bg:#fafafa;
  --surface:#ffffff;
  --ink:#0b0b0c;
  --muted:#62666d;
  --line:rgba(0,0,0,.08);
  --accent:#4353ff; --accent-text:var(--accent);
  --accent-ink:#ffffff;
  --ok:#17784c;
  --warn:#8a5200;
  --bad:#b42318;
  --shadow:0 0 0 1px var(--line),0 6px 24px rgba(0,0,0,.06);
  --line-strong:rgba(0,0,0,.16);
  --faint:#9a9ea6;
  --sheet-2:#f4f4f5;
  --accent-soft:rgba(67,83,255,.08);
  --flow-a:#4353ff;
  --flow-b:#17784c;
  --flow-c:#8a8f98;
  --flow-d:#7c4dff;
  --bg-glow:radial-gradient(60% 50% at 50% 0%,rgba(80,100,240,.07),transparent 70%);
  --headline:linear-gradient(180deg,#0b0b0c 40%,rgba(11,11,12,.6));
}
@media (prefers-reduced-motion:reduce){:root{--t-fast:0ms;--t-med:0ms}}
</style>
<style>
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-body);overflow:hidden}
body::before{content:"";position:fixed;inset:0;background:var(--bg-glow,none);pointer-events:none}
#stage{position:fixed;inset:0}
.head{position:fixed;top:calc(var(--space)*2);left:calc(var(--space)*2);right:calc(var(--space)*2);pointer-events:none}
.head h1{font:var(--h1-weight) 28px/var(--h1-lead) var(--font-display);letter-spacing:var(--h1-track);margin:0}
.head p{margin:2px 0 0;color:var(--muted)}
.label{font:600 12.5px var(--font-body);color:var(--ink);background:color-mix(in srgb,var(--surface) 90%,transparent);border:var(--border);border-radius:999px;padding:3px calc(var(--space)*1.25);white-space:nowrap;cursor:pointer;user-select:none;transition:border-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.label.on{border-color:var(--accent);color:var(--accent-text)}
.info{position:fixed;left:calc(var(--space)*2);right:calc(var(--space)*2);bottom:calc(var(--space)*2);max-width:520px;background:color-mix(in srgb,var(--surface) 90%,transparent);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:calc(var(--space)*1.5) calc(var(--space)*2);backdrop-filter:blur(6px)}
.info b{display:block;font-family:var(--font-display)}
.key{position:fixed;right:calc(var(--space)*2);top:calc(var(--space)*2);font:12px var(--font-mono);color:var(--muted);text-align:right}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div class="head"><h1 id="title"></h1><p id="sub"></p></div>
<div class="key" id="key"></div>
<div class="info" id="info"></div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

// ===== Edit this. Placeholders are in [brackets]. =====
const SCENE = {
  title: "[How the parts of the business fit]",
  sub: "Drag to turn, scroll to zoom, click a box name.",
  intro: "[One plain sentence on the big picture. Click any name to read what it does.]",
  nodes: [ // pos is [x, y, z]; keep it within about -6..6
    { id: "a", name: "[Box 1]", about: "[What it is, one clause]", pos: [-5, 0, 0], color: "--flow-a" },
    { id: "b", name: "[Box 2]", about: "[What it is, one clause]", pos: [0, 2, -2], color: "--flow-b" },
    { id: "c", name: "[Box 3]", about: "[What it is, one clause]", pos: [5, 0, 0], color: "--flow-c" },
    { id: "d", name: "[Box 4]", about: "[What it is, one clause]", pos: [0, -2, 3], color: "--flow-d" }
  ],
  edges: [ // what moves from one node to the next; particles flow from -> to
    { from: "a", to: "b", what: "[what moves]", color: "--flow-a" },
    { from: "b", to: "c", what: "[what moves]", color: "--flow-b" },
    { from: "c", to: "d", what: "[what moves]", color: "--flow-c" },
    { from: "d", to: "a", what: "[what moves]", color: "--flow-d" }
  ],
  key: "Dots = [what the moving dots stand for]"
};
// ===== End of edits. =====

const $ = id => document.getElementById(id);
// Read a design token as a CSS color; systems without --flow-* fall back to their accent and state colors.
const FALLBACK = { "--flow-a": "--accent", "--flow-b": "--ok", "--flow-c": "--muted", "--flow-d": "--warn" };
const tok = n => { const cs = getComputedStyle(document.documentElement); return cs.getPropertyValue(n).trim() || cs.getPropertyValue(FALLBACK[n] || "--accent").trim(); };
const tint = n => new THREE.Color(tok(n));
$("title").textContent = SCENE.title; $("sub").textContent = SCENE.sub;
$("info").textContent = SCENE.intro; $("key").textContent = SCENE.key;

const stage = $("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);
const labels = new CSS2DRenderer();
labels.domElement.style.position = "absolute"; labels.domElement.style.inset = "0";
stage.appendChild(labels.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
camera.position.set(0, 6, 15);
const controls = new OrbitControls(camera, labels.domElement);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.6;
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(5, 10, 7); scene.add(sun);

const byId = {}, labelEls = [], recolor = [];
function select(n, el){
  labelEls.forEach(x => x.classList.toggle("on", x === el));
  const out = SCENE.edges.filter(e => e.from === n.id).map(e => e.what + " to " + byId[e.to].name);
  const inn = SCENE.edges.filter(e => e.to === n.id).map(e => e.what + " from " + byId[e.from].name);
  const info = $("info"); info.innerHTML = "";
  const b = document.createElement("b"); b.textContent = n.name; info.appendChild(b);
  info.appendChild(document.createTextNode(n.about + (inn.length ? " Gets " + inn.join(", ") + "." : "") + (out.length ? " Sends " + out.join(", ") + "." : "")));
  controls.autoRotate = false;
}
for (const n of SCENE.nodes){
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4),
    new THREE.MeshStandardMaterial({ color: tint(n.color), roughness: 0.45, metalness: 0.1 }));
  mesh.position.set(...n.pos); scene.add(mesh);
  const el = document.createElement("div"); el.className = "label"; el.textContent = n.name;
  el.addEventListener("pointerdown", ev => { ev.stopPropagation(); select(n, el); });
  const tag = new CSS2DObject(el); tag.position.set(0, 1.25, 0); mesh.add(tag);
  labelEls.push(el); byId[n.id] = { ...n, mesh };
  recolor.push(() => mesh.material.color.copy(tint(n.color)));
}

const flows = [];
for (const e of SCENE.edges){
  const a = new THREE.Vector3(...byId[e.from].pos), b = new THREE.Vector3(...byId[e.to].pos);
  const mid = a.clone().add(b).multiplyScalar(0.5).add(new THREE.Vector3(0, 1.2, 0));
  const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(48)),
    new THREE.LineBasicMaterial({ color: tint(e.color), transparent: true, opacity: 0.45 }));
  scene.add(line);
  recolor.push(() => line.material.color.copy(tint(e.color)));
  const dots = [];
  for (let k = 0; k < 6; k++){
    const d = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 12), new THREE.MeshBasicMaterial({ color: tint(e.color) }));
    scene.add(d); dots.push({ d, t: k / 6 });
    recolor.push(() => d.material.color.copy(tint(e.color)));
  }
  flows.push({ curve, dots });
}

// Recolor the scene when the theme changes (data-theme on <html>, or the OS setting).
const retheme = () => recolor.forEach(f => f());
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", retheme);

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); labels.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  for (const f of flows) for (const p of f.dots){
    p.t = (p.t + dt * 0.18) % 1;
    p.d.position.copy(f.curve.getPoint(p.t));
  }
  controls.update();
  renderer.render(scene, camera); labels.render(scene, camera);
});
</script>
</body>
</html>
